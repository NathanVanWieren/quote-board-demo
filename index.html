<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quote Board Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --steel: #dfe5ea;
  --steel-deep: #cfd8df;
  --sheet: #fbfcfc;
  --ink: #17252f;
  --ink-soft: #52626e;
  --line: #b9c5ce;
  --dye: #1e3f9e;
  --dye-soft: #dfe6f8;
  --on-dye: #ffffff;
  --age: #8a4a00;
  --age-soft: #fbecd2;
  --bad: #a42323;
  --good: #1c6b43;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --steel: #141c23; --steel-deep: #1c262f; --sheet: #222e38; --ink: #e8eef2; --ink-soft: #a6b5c0;
    --line: #3c4b57; --dye: #9db4f5; --dye-soft: #2a3963; --on-dye: #101a33;
    --age: #f3bd6e; --age-soft: #4a3313; --bad: #f19a9a; --good: #7fd3a6;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --steel: #141c23; --steel-deep: #1c262f; --sheet: #222e38; --ink: #e8eef2; --ink-soft: #a6b5c0;
  --line: #3c4b57; --dye: #9db4f5; --dye-soft: #2a3963; --on-dye: #101a33;
  --age: #f3bd6e; --age-soft: #4a3313; --bad: #f19a9a; --good: #7fd3a6;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--steel); color: var(--ink); font: 400 15px/1.45 Barlow, Arial, sans-serif; }
h1, h2, h3 { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 600; margin: 0; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--dye); outline-offset: 2px; }

input, select, textarea {
  width: 100%; min-height: 38px; padding: 7px 9px; background: var(--sheet);
  border: 1px solid var(--line); border-radius: 3px;
}
input[type="checkbox"] { width: 18px; min-height: 18px; accent-color: var(--dye); }
textarea { min-height: 76px; resize: vertical; }
label { display: grid; gap: 3px; font-weight: 500; font-size: 14px; }
label.check { display: flex; align-items: center; gap: 7px; font-weight: 400; white-space: nowrap; }

.btn {
  min-height: 38px; padding: 6px 13px; background: transparent; border: 1px solid var(--line);
  border-radius: 3px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--steel-deep); }
.btn.primary { background: var(--dye); color: var(--on-dye); border-color: var(--dye); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.quiet { border-color: transparent; }

.topbar {
  display: flex; align-items: center; gap: 22px; padding: 9px 18px;
  background: var(--dye); color: var(--on-dye); flex-wrap: wrap;
}
.topbar h1 { font-size: 25px; }
.topbar nav { display: flex; gap: 4px; }
.topbar nav button {
  background: none; border: 0; color: inherit; padding: 6px 10px; cursor: pointer;
  font-weight: 500; border-bottom: 3px solid transparent;
}
.topbar nav button[aria-current="page"] { border-bottom-color: currentColor; }
.topbar :focus-visible { outline-color: currentColor; }
.topbar .spacer { flex: 1; }
.topbar .who { display: flex; align-items: center; gap: 4px; }
.topbar .btn { color: inherit; border-color: currentColor; }
.topbar .btn:hover { background: transparent; text-decoration: underline; }
.topbar .btn.quiet { border-color: transparent; }

.filters { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 12px 18px 4px; }
.filters label { min-width: 145px; }
.views.layout { flex: none; }
.filters .search { min-width: 220px; flex: 0 1 280px; }
.views { display: flex; flex-wrap: wrap; gap: 4px; }
.views button { min-height: 38px; padding: 5px 10px; background: none; border: 1px solid transparent; border-radius: 3px; cursor: pointer; }
.views button:hover { background: var(--steel-deep); }
.views button[aria-pressed="true"] { background: var(--dye-soft); border-color: var(--dye); font-weight: 500; }

.board-wrap { overflow-x: auto; padding: 8px 18px 22px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(166px, 1fr); gap: 0 6px; min-width: min-content; grid-template-rows: auto auto; }
.lane-label {
  grid-row: 1; font: 600 16px "Barlow Condensed", Arial, sans-serif; color: var(--ink-soft);
  border-bottom: 2px solid var(--ink-soft); padding-bottom: 2px; margin-bottom: 7px;
}
.lane-label.engineering { color: var(--dye); border-bottom-color: var(--dye); }
.lane-label.shared { color: var(--ink); border-bottom-style: double; border-bottom-width: 4px; padding-bottom: 0; }
.column { grid-row: 2; display: flex; flex-direction: column; min-height: calc(100vh - 210px); background: var(--steel-deep); border-radius: 3px; }
.column header { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 10px 4px; gap: 8px; }
.column h2 { font-size: 19px; }
.column .count { font: 600 22px "Barlow Condensed", Arial, sans-serif; color: var(--ink-soft); }
.tiles { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 4px 6px 10px; min-height: 90px; }
.tiles.empty::after { content: "No quotes"; color: var(--ink-soft); text-align: center; padding: 14px 0; font-size: 14px; }
.tiles.sortable-over.empty::after, .dragging .tiles.empty::after { content: ""; }

.tile {
  position: relative; display: block; width: 100%; text-align: left; padding: 8px 9px 7px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; cursor: grab;
}
.tile:hover { border-color: var(--dye); }
.tile.readonly { cursor: pointer; }
.tile.sortable-ghost { opacity: .35; }
.tile.sortable-drag { box-shadow: 0 6px 16px rgb(10 25 40 / .28); transform: rotate(1deg); }
.tile.internal { padding-top: 15px; }
.tile.internal::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 8px;
  background: repeating-linear-gradient(135deg, var(--dye) 0 2px, transparent 2px 6px);
}
.tile .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 8px; }
.tile .row.top { align-items: flex-start; flex-wrap: nowrap; }
.tile .dates { text-align: right; }
.tile .due.slipping, td.slipping { color: var(--age); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.chip { padding: 0 5px; border: 1px solid var(--line); border-radius: 2px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.chip.key { background: var(--dye); border-color: var(--dye); color: var(--on-dye); }
.owners { display: inline-flex; gap: 6px; }
.owner { display: inline-flex; align-items: center; gap: 2px; }
.owner-role { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
.tile .number { white-space: nowrap; font: 500 15px "Barlow Condensed", Arial, sans-serif; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tile .due { white-space: nowrap; font-size: 13px; color: var(--ink-soft); }
.tile .due.late { color: var(--bad); font-weight: 600; }
.tile .title { font-weight: 600; line-height: 1.25; margin: 1px 0; overflow-wrap: anywhere; }
.tile .customer { color: var(--ink-soft); font-size: 14px; }
.tile .missing { margin: 5px 0 0; padding: 3px 6px; background: var(--age-soft); color: var(--age); font-size: 13px; overflow-wrap: anywhere; }
.tile .foot { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
.tile .age.old { color: var(--age); font-weight: 600; }
.avatar {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: var(--dye-soft); color: var(--dye); font-weight: 600; font-size: 12px;
}
.avatar.none { background: none; border: 1px dashed var(--ink-soft); color: var(--ink-soft); }

.page { max-width: 1120px; margin: 0 auto; padding: 20px 18px 40px; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h2 { font-size: 30px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; background: var(--sheet); border: 1px solid var(--line); margin-bottom: 18px; }
.stat { padding: 10px 14px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font: 600 34px/1.05 "Barlow Condensed", Arial, sans-serif; }
.stat span { color: var(--ink-soft); font-size: 14px; }
.page > .panel { margin-bottom: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 18px; }
.panel { background: var(--sheet); border: 1px solid var(--line); padding: 13px 15px; min-width: 0; }
.panel h3 { font-size: 21px; margin-bottom: 9px; }
.panel .hint { color: var(--ink-soft); font-size: 14px; margin: -5px 0 10px; }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 30px; gap: 8px; align-items: center; margin: 5px 0; font-size: 14px; }
.bar-track { height: 13px; background: var(--steel); }
.bar { height: 13px; min-width: 2px; background: var(--dye); border-radius: 0 3px 3px 0; }
.bar-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.panel .bar-row:has(.bar[data-tip*="$"]) { grid-template-columns: 112px minmax(0, 1fr) 58px; }
.sales-grid { grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); }
.history-filters { padding: 0 0 14px; }
.history-table th, .history-table td { white-space: nowrap; }
.panel > .btn { margin-top: 10px; }
.sample-note { margin-bottom: 14px; }
.chart { display: block; width: 100%; height: auto; }
.chart text { fill: var(--ink-soft); font: 400 12px Barlow, Arial, sans-serif; }
.chart .end-label { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; opacity: .55; }
.chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--series-1); stroke: var(--sheet); stroke-width: 2; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--ink); fill-opacity: .06; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 11px; height: 11px; border-radius: 2px; }
.chart-table { margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
.chart-table summary { cursor: pointer; }
.chart-table table { margin-top: 5px; color: var(--ink); }
.chart-tip { position: fixed; z-index: 30; max-width: 280px; padding: 5px 9px; background: var(--ink); color: var(--sheet); border-radius: 3px; font-size: 13px; pointer-events: none; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; border-bottom: 2px solid var(--ink-soft); padding: 5px 8px 4px 0; }
td { border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.work-list { margin: 0; padding: 0; list-style: none; }
.work-list span { color: var(--ink-soft); }
.empty-note { color: var(--ink-soft); margin: 4px 0; }

.settings-row { display: grid; grid-template-columns: 74px minmax(100px, 1fr) 118px auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.settings-row .order { display: flex; gap: 2px; }
.icon-btn { width: 34px; min-height: 34px; padding: 0; }
.lane-tag { color: var(--ink-soft); font-size: 14px; }
.user-row { grid-template-columns: minmax(130px, 1fr) 110px auto auto; }
.table-panel { padding: 0; }
.quote-table { min-width: 1240px; }
.quote-table th, .quote-table td { padding: 7px 10px; white-space: nowrap; }
.quote-table td:nth-child(2) { white-space: normal; min-width: 170px; }
.quote-table tbody tr:hover { background: var(--dye-soft); }
.quote-table th { padding: 0; }
.sort { width: 100%; min-height: 38px; padding: 6px 10px; background: none; border: 0; text-align: left; font-weight: 600; cursor: pointer; }
.sort:hover { background: var(--steel-deep); }
.link { padding: 0; background: none; border: 0; color: var(--dye); text-decoration: underline; cursor: pointer; font: inherit; overflow-wrap: anywhere; text-align: left; }
.work-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 14px; align-items: start; }
.work-grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(620px, 100%), 1fr)); }
.assign-panel { margin-bottom: 16px; }
.assign-panel select { min-width: 150px; }
.section-title { font-size: 21px; }
.view-note { margin: 2px 0 9px; color: var(--ink-soft); font-size: 14px; }
.work-table th, .work-table td { white-space: nowrap; }
.work-table td:nth-child(2) { white-space: normal; }
.rank-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; background: var(--steel); border-radius: 2px; }
.rank-row.movable { cursor: grab; }
.rank-row.sortable-ghost { opacity: .35; }
.rank { flex: none; width: 34px; font: 600 27px/1 "Barlow Condensed", Arial, sans-serif; text-align: center; font-variant-numeric: tabular-nums; }
.rank-body { flex: 1; min-width: 0; }
.rank-meta { color: var(--ink-soft); font-size: 13px; }
.rank-row .order { display: flex; gap: 2px; flex: none; }
.read-field { display: grid; gap: 3px; align-content: start; font-size: 14px; }
.read-label { font-weight: 500; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; margin-top: 12px; }

dialog { width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--sheet); color: var(--ink); box-shadow: 0 16px 42px rgb(10 25 40 / .35); }
dialog::backdrop { background: rgb(14 28 41 / .55); }
dialog.small { width: min(460px, calc(100vw - 24px)); }
.dialog-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 14px 18px 8px; }
.dialog-head h2 { font-size: 25px; }
.dialog-head .sub { color: var(--ink-soft); font-size: 14px; }
.dialog-body { padding: 4px 18px 14px; display: grid; gap: 11px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--sheet); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 11px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; margin-top: 6px; }
.dialog-body h3 { font-size: 20px; }
.key-check { align-self: end; min-height: 38px; font-weight: 500; }
.hint-text { color: var(--ink-soft); font-size: 14px; margin: 2px 0 6px; }
.document { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.file-input { margin-top: 8px; padding: 6px; }
.notice { padding: 7px 9px; background: var(--age-soft); color: var(--age); font-size: 14px; }
.error { color: var(--bad); font-size: 14px; font-weight: 500; }
.parts-head { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
.part-row { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)) 34px; gap: 6px; align-items: end; margin-top: 5px; }
.part-row label { font-size: 13px; font-weight: 400; }
.history { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.history li { padding: 5px 0; border-bottom: 1px solid var(--line); }
.history small { color: var(--ink-soft); display: block; font-size: 13px; }

.login { min-height: 100%; display: grid; place-items: center; padding: 18px; background: var(--dye); }
.login form { width: min(370px, 100%); background: var(--sheet); padding: 22px; display: grid; gap: 12px; border-radius: 3px; }
.login h1 { font-size: 34px; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 32px); }
#toast div { background: var(--ink); color: var(--sheet); padding: 9px 14px; border-radius: 3px; }

@media (max-width: 640px) {
  .topbar { gap: 8px; padding: 8px 16px; }
  .filters, .board-wrap { padding-left: 16px; padding-right: 16px; }
  .cols2, .cols3 { grid-template-columns: 1fr; }
  .chart text { font-size: 16px; }
  .part-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .settings-row, .user-row { grid-template-columns: 1fr 1fr; }
  .stat { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.who .btn:last-child { display: none; }
.demo-note { padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); background: var(--age-soft); color: var(--age); font-size: 14px; }

</style>
</head>
<body>
<div class="demo-note">Demo with made-up quotes. Changes disappear when you reload.</div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

    if (d) { quotes.forEach((x) => { x.documents = x.documents.filter((doc) => doc.id !== Number(d[1])); }); return { ok: true }; }
    if (m && m[2]) return clone(move(q, body));
    if (m && method === "GET") return clone(view(q));
    const o = path.match(/^\/api\/sales-priorities\/(\d+)$/);
    if (o) { body.quote_ids.forEach((id, i) => { quotes.find((x) => x.id === id).sales_priority = i + 1; }); return { ok: true }; }
    if (m) { const moved = q.sales_owner_id !== body.sales_owner_id; const rank = moved ? null : q.sales_priority; Object.assign(q, body, { sales_priority: rank, version: q.version + 1 }); sync(); return clone(view(q)); }
    if (path === "/api/history") { if (method === "POST") throw rule("Uploading a history file works in the installed app."); return clone(window.HISTORY_SAMPLE); }
    if (path === "/api/reports") return report();
    if (path === "/api/sales-dashboard") return clone(window.SALES_SAMPLE);
    if (path === "/api/handoffs") return clone(handoffs);
    if (path === "/api/stages" || path.startsWith("/api/stages/") || path.startsWith("/api/users") || path === "/api/me/password") throw rule("Settings changes work in the installed app.");
    return { ok: true };
  };
})();

</script>
<script>
"use strict";
/* The whole screen is rebuilt from `state`. Change state, call render(). */
const state = { view: "board", me: null, users: [], stages: [], lossReasons: [], customers: [], quotes: [],
                filter: { search: "", sales: "", engineering: "", type: "", preset: "all" }, layout: "board",
                sort: { key: "due", direction: 1 }, dragging: false };

const OLD_DAYS = 7;
const app = document.getElementById("app");

/* Builds a page element. Text always goes in as text, so typed data can't become HTML. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value === null || value === undefined) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else if (key === "value") node.value = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  node.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
  return node;
}

async function serverApi(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined, credentials: "same-origin",
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.detail || "That didn't save. Check your connection and try again.");
    error.status = response.status;
    error.field = data.field;
    throw error;
  }
  return data;
}
const api = window.demoApi || serverApi;  // the online demo swaps in a pretend server

async function uploadFile(path, file) {
  if (window.demoApi) return window.demoApi("POST", path, { filename: file.name, size_bytes: file.size });
  const form = new FormData();
  form.append("file", file);
  const response = await fetch(path, { method: "POST", body: form, credentials: "same-origin" });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error(data.detail || "That file didn't upload. Try again."), { status: response.status });
  return data;
}

function toast(message) {
  const box = document.getElementById("toast");
  box.replaceChildren(el("div", {}, message));
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.replaceChildren(), 4500);
}

const canEdit = () => state.me && state.me.role !== "viewer";
const isAdmin = () => state.me && state.me.role === "admin";
const activeUsers = () => state.users.filter((u) => u.active);
const stageById = (id) => state.stages.find((s) => s.id === id);
const daysSince = (ts) => Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
const today = () => new Date().toISOString().slice(0, 10);
const shortDate = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fullDate = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
const dateTime = (ts) => new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const numberOrNull = (v) => (v === "" || v === null || v === undefined ? null : Number(v));

function options(items, selected, blank) {
  return [
    blank !== undefined && el("option", { value: "" }, blank),
    ...items.map(([value, text]) => {
      const option = el("option", { value }, text);
      if (String(value) === String(selected ?? "")) option.selected = true;
      return option;
    }),
  ];
}
const userOptions = (selected, blank) => options(activeUsers().map((u) => [u.id, u.display_name]), selected, blank);

/* ---------- loading ---------- */
async function loadAll() {
  const boot = await api("GET", "/api/bootstrap");
  Object.assign(state, { me: boot.me, users: boot.users, stages: boot.stages, lossReasons: boot.loss_reasons, customers: boot.customers });
  state.quotes = await api("GET", "/api/quotes");
}

async function refresh() {
  await loadAll();
  render();
}

function handleError(error) {
  if (error.status === 401) { state.me = null; renderLogin(); return; }
  toast(error.message);
  if (error.status === 409) refresh().catch(() => {});
}

/* ---------- login ---------- */
function renderLogin() {
  const message = el("div", { class: "error", role: "alert" });
  const username = el("input", { autocomplete: "username", required: true, autofocus: true });
  const password = el("input", { type: "password", autocomplete: "current-password", required: true });
  document.body.classList.add("signed-out");
  app.replaceChildren(el("main", { class: "login" }, el("form", {
    onsubmit: async (event) => {
      event.preventDefault();
      message.textContent = "";
      try {
        await api("POST", "/api/login", { username: username.value, password: password.value });
        await refresh();
      } catch (error) { message.textContent = error.message; }
    },
  }, el("h1", {}, "Quote board"), el("label", {}, "Username", username), el("label", {}, "Password", password),
     message, el("button", { class: "btn primary", type: "submit" }, "Sign in"))));
}

/* ---------- shell ---------- */
function render() {
  if (!state.me) return renderLogin();
  const tabs = [["board", "Board"], ["history", "History"], ["report", "Report"], ["sales", "Sales"], isAdmin() && ["settings", "Settings"]].filter(Boolean);
  if (state.view === "settings" && !isAdmin()) state.view = "board";
  const nav = tabs.map(([view, text]) => el("button", {
    "aria-current": state.view === view ? "page" : null,
    onclick: () => { state.view = view; render(); },
  }, text));
  const top = el("header", { class: "topbar" }, el("h1", {}, "Quote board"), el("nav", { "aria-label": "Main" }, nav),
    el("div", { class: "spacer" }),
    canEdit() && el("button", { class: "btn", onclick: () => openQuote(null) }, "New quote"),
    el("div", { class: "who" }, el("button", { class: "btn quiet", onclick: openPassword, title: "Change your password" }, state.me.display_name),
      el("button", { class: "btn quiet", onclick: async () => { await api("POST", "/api/logout"); state.me = null; renderLogin(); } }, "Sign out")));
  const page = { board: renderBoard, history: renderHistory, report: renderReport, sales: renderSales, settings: renderSettings }[state.view]();
  app.replaceChildren(top, page);
  if (state.view === "board") afterDraw();
}

/* ---------- board ---------- */
const isOpen = (q) => ["open", "hold"].includes(stageById(q.stage_id).kind);

const PRESETS = [
  ["all", "All", () => true],
  ["mine", "Mine", (q) => q.sales_owner_id === state.me.id || q.engineering_owner_id === state.me.id],
  ["priorities", "Priority order", isOpen],
  ["top", "Top priority", (q) => isOpen(q) && q.sales_priority === 1],
  ["key", "Key deals", (q) => Boolean(q.key_deal)],
  ["unassigned", "No engineer", (q) => isOpen(q) && !q.engineering_owner_id],
  ["active", "Actively quoting", (q) => stageById(q.stage_id).key === "quoting"],
  ["rfq", "In RFQ", (q) => stageById(q.stage_id).key === "rfq"],
  ["internal", "Internal work", (q) => q.work_type === "internal"],
];

/* These two saved views have their own layouts, so Board and Table don't apply. */
const specialView = () => ["priorities", "unassigned"].includes(state.filter.preset);

function matchesFilters(q, ignorePreset = false) {
  const f = state.filter;
  const text = f.search.trim().toLowerCase();
  if (text && !`${q.quote_number} ${q.title} ${q.customer} ${q.contact_name}`.toLowerCase().includes(text)) return false;
  if (f.sales === "none" ? q.sales_owner_id : f.sales && String(q.sales_owner_id) !== f.sales) return false;
  if (f.engineering === "none" ? q.engineering_owner_id : f.engineering && String(q.engineering_owner_id) !== f.engineering) return false;
  if (f.type && q.work_type !== f.type) return false;
  return ignorePreset || PRESETS.find((p) => p[0] === f.preset)[2](q);
}

const dayGap = (q) => (q.due_date && q.estimated_completion_date
  ? Math.round((new Date(q.estimated_completion_date) - new Date(q.due_date)) / 86400000) : null);

function ownerBadge(letter, role, initials, name) {
  return el("span", { class: "owner", title: `${role}: ${name || "Unassigned"}`, "aria-label": `${role}: ${name || "Unassigned"}` },
    el("span", { class: "owner-role" }, letter),
    el("span", { class: `avatar${initials ? "" : " none"}` }, initials || "?"));
}

function tile(q) {
  const age = daysSince(q.stage_entered_at);
  const open = isOpen(q);
  const late = q.due_date && q.due_date < today() && open;
  const gap = dayGap(q);
  const chips = [
    q.sales_priority && el("span", { class: "chip", title: `Priority ${q.sales_priority} for ${q.sales_owner_name}` }, `P${q.sales_priority}`),
    q.key_deal ? el("span", { class: "chip key" }, "Key deal") : null,
    q.work_type === "internal" && el("span", { class: "chip" }, "Internal"),
  ].filter(Boolean);
  return el("button", {
    class: `tile${q.work_type === "internal" ? " internal" : ""}${canEdit() ? "" : " readonly"}`,
    "data-id": q.id, type: "button", onclick: () => openQuote(q.id),
    "aria-label": `${q.quote_number}, ${q.title}, ${q.customer}`,
  },
    el("div", { class: "row top" }, el("span", { class: "number" }, q.quote_number),
      el("div", { class: "dates" },
        q.due_date && el("div", { class: `due${late ? " late" : ""}` }, `${late ? "Late" : "Due"} ${shortDate(q.due_date)}`),
        q.estimated_completion_date && el("div", { class: `due${gap > 0 && open ? " slipping" : ""}` }, `Est ${shortDate(q.estimated_completion_date)}`))),
    el("div", { class: "title" }, q.title),
    el("div", { class: "customer" }, q.customer),
    chips.length > 0 && el("div", { class: "chips" }, chips),
    q.missing_info && el("p", { class: "missing" }, `Needs: ${q.missing_info}`),
    el("div", { class: "row foot" },
      el("span", { class: `age${age >= OLD_DAYS ? " old" : ""}`, title: `${age} days in this stage` }, `${age}d`),
      el("span", { class: "owners" },
        ownerBadge("S", "Sales owner", q.sales_owner_initials, q.sales_owner_name),
        ownerBadge("E", "Engineering owner", q.engineering_owner_initials, q.engineering_owner_name))));
}

function column(stage) {
  const quotes = state.quotes.filter((q) => q.stage_id === stage.id && matchesFilters(q));
  return el("section", { class: "column", "aria-label": stage.name },
    el("header", {}, el("h2", {}, stage.name), el("span", { class: "count" }, quotes.length)),
    el("div", { class: `tiles${quotes.length ? "" : " empty"}`, "data-stage": stage.id }, quotes.map(tile)));
}

function renderBoard() {
  const f = state.filter;
  const update = (key) => (event) => { f[key] = event.target.value; render(); };
  const search = el("input", { type: "search", value: f.search, placeholder: "Quote, title, customer, or contact",
    oninput: (event) => { f.search = event.target.value; drawContent(); } });
  const ownerChoices = [...activeUsers().map((u) => [u.id, u.display_name]), ["none", "Unassigned"]];
  const filters = el("div", { class: "filters" },
    !specialView() && el("div", { class: "views layout", role: "group", "aria-label": "Layout" }, [["board", "Board"], ["table", "Table"]].map(([key, text]) =>
      el("button", { "aria-pressed": String(state.layout === key), onclick: () => { state.layout = key; render(); } }, text))),
    el("label", { class: "search" }, "Search", search),
    el("label", {}, "Sales owner", el("select", { onchange: update("sales") }, options(ownerChoices, f.sales, "Everyone"))),
    el("label", {}, "Engineering owner", el("select", { onchange: update("engineering") }, options(ownerChoices, f.engineering, "Everyone"))),
    el("label", {}, "Work type", el("select", { onchange: update("type") },
      options([["customer", "Customer RFQ"], ["internal", "Internal work"]], f.type, "All"))),
    el("div", { class: "views", role: "group", "aria-label": "Saved views" }, PRESETS.map(([key, text]) =>
      el("button", { "aria-pressed": String(f.preset === key), onclick: () => { f.preset = key; render(); } }, text))));
  return el("main", {}, filters, el("div", { class: "board-wrap" }, boardContent()));
}

function boardContent() {
  if (state.filter.preset === "priorities") return buildPriorityLists();
  if (state.filter.preset === "unassigned") return buildAssignments();
  return state.layout === "table" ? buildTable() : buildColumns();
}

function afterDraw() {
  if (state.filter.preset === "priorities") wireRanking();
  else if (!specialView() && state.layout === "board") wireDragging();
}

function drawContent() {
  document.querySelector(".board-wrap").replaceChildren(boardContent());
  afterDraw();
}

const dateCell = (d) => (d ? shortDate(d) : "");
const stageName = (q) => stageById(q.stage_id).name;

/* Priority order: one ranked list per salesperson. */
const canRank = (ownerId) => canEdit() && (isAdmin() || state.me.id === ownerId);

async function saveOrder(ownerId, ids) {
  try {
    await api("PUT", `/api/sales-priorities/${ownerId}`, { quote_ids: ids });
    toast("Priority order saved");
  } catch (error) { handleError(error); }
  await refresh().catch(() => {});
}

function buildPriorityLists() {
  const open = state.quotes.filter((q) => matchesFilters(q));
  const owners = [...new Map(open.filter((q) => q.sales_owner_id).map((q) => [q.sales_owner_id, q.sales_owner_name]))]
    .sort((a, b) => (b[0] === state.me.id) - (a[0] === state.me.id) || a[1].localeCompare(b[1]));
  const missing = open.filter((q) => !q.sales_owner_id).length;
  const lists = owners.map(([ownerId, name]) => {
    const quotes = open.filter((q) => q.sales_owner_id === ownerId).sort((a, b) => a.sales_priority - b.sales_priority);
    const editable = canRank(ownerId);
    const shift = (index, delta) => () => {
      const ids = quotes.map((q) => q.id);
      [ids[index], ids[index + delta]] = [ids[index + delta], ids[index]];
      saveOrder(ownerId, ids);
    };
    const rows = quotes.map((q, index) => el("li", { class: `rank-row${editable ? " movable" : ""}`, "data-id": q.id },
      el("span", { class: "rank" }, q.sales_priority),
      el("div", { class: "rank-body" },
        el("button", { class: "link", type: "button", onclick: () => openQuote(q.id) }, q.title),
        el("div", { class: "rank-meta" }, `${q.quote_number}, ${q.customer}, ${stageName(q)}`),
        el("div", { class: "rank-meta" }, [q.due_date && `Due ${shortDate(q.due_date)}`, q.estimated_completion_date && `Est ${shortDate(q.estimated_completion_date)}`].filter(Boolean).join(", ")),
        q.key_deal ? el("div", { class: "chips" }, el("span", { class: "chip key" }, "Key deal")) : null),
      editable && el("div", { class: "order" },
        el("button", { class: "btn icon-btn", type: "button", "aria-label": `Move ${q.title} up`, disabled: index === 0, onclick: shift(index, -1) }, "↑"),
        el("button", { class: "btn icon-btn", type: "button", "aria-label": `Move ${q.title} down`, disabled: index === quotes.length - 1, onclick: shift(index, 1) }, "↓"))));
    return el("section", { class: "panel" }, el("h3", {}, name),
      el("p", { class: "hint" }, editable ? "Drag quotes into order, highest priority first" : "Only this salesperson or an admin can change this order"),
      el("ol", { class: "rank-list", "data-owner": ownerId }, rows));
  });
  if (!lists.length) return el("div", { class: "panel" }, el("p", { class: "empty-note" }, "Assign a sales owner to an open quote to start a priority list."));
  return el("div", {}, missing > 0 && el("p", { class: "view-note" }, `${missing} open quote${missing === 1 ? " has" : "s have"} no sales owner, so ${missing === 1 ? "it isn't" : "they aren't"} ranked.`),
    el("div", { class: "work-grid" }, lists));
}

function wireRanking() {
  if (!window.Sortable) return;
  document.querySelectorAll(".rank-list").forEach((list) => {
    const ownerId = Number(list.dataset.owner);
    if (!canRank(ownerId)) return;
    Sortable.create(list, {
      animation: 120, forceFallback: true, fallbackTolerance: 5, delay: 120, delayOnTouchOnly: true, filter: "button", preventOnFilter: false,
      onStart: () => { state.dragging = true; },
      onEnd: (event) => {
        state.dragging = false;
        if (event.oldIndex === event.newIndex) return;
        saveOrder(ownerId, [...list.children].map((row) => Number(row.dataset.id)));
      },
    });
  });
}

/* No engineer: quotes waiting for an engineer, with each engineer's current work below. */
async function assignEngineer(quoteId, engineerId) {
  try {
    const quote = await api("GET", `/api/quotes/${quoteId}`);
    await api("PATCH", `/api/quotes/${quoteId}`, { ...quote, engineering_owner_id: engineerId });
    await refresh();
    toast(`${quote.quote_number} assigned`);
  } catch (error) { handleError(error); }
}

function quoteTable(quotes, firstColumn = null) {
  const headers = ["Quote", "Title", "Customer", "Stage", "Priority", "Key deal", "Quote due", "Est. completion"];
  return el("div", { class: "scroll" }, el("table", { class: "work-table" },
    el("thead", {}, el("tr", {}, firstColumn && el("th", {}, firstColumn.title), headers.map((h) => el("th", {}, h)))),
    el("tbody", {}, quotes.map((q) => el("tr", {}, firstColumn && el("td", {}, firstColumn.cell(q)),
      el("td", {}, el("button", { class: "link", type: "button", onclick: () => openQuote(q.id) }, q.quote_number)),
      el("td", {}, q.title), el("td", {}, q.customer), el("td", {}, stageName(q)),
      el("td", {}, q.sales_priority ? `P${q.sales_priority}` : ""), el("td", {}, q.key_deal ? "Key deal" : ""),
      el("td", {}, dateCell(q.due_date)), el("td", {}, dateCell(q.estimated_completion_date)))))));
}

const byDueDate = (a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999");

function buildAssignments() {
  const open = state.quotes.filter((q) => isOpen(q) && matchesFilters(q, true));
  const waiting = open.filter((q) => !q.engineering_owner_id).sort(byDueDate);
  const engineers = activeUsers().filter((u) => u.role === "quoter" || open.some((q) => q.engineering_owner_id === u.id));
  const choices = (q) => el("select", {
    "aria-label": `Assign an engineer to ${q.quote_number}`, disabled: !canEdit(),
    onchange: (event) => { if (event.target.value) assignEngineer(q.id, Number(event.target.value)); },
  }, options(engineers.map((u) => [u.id, u.display_name]), "", "Choose engineer"));
  const load = engineers
    .map((engineer) => ({ engineer, quotes: open.filter((q) => q.engineering_owner_id === engineer.id).sort(byDueDate) }))
    .filter(({ engineer }) => !state.filter.engineering || String(engineer.id) === state.filter.engineering)
    .sort((a, b) => a.quotes.length - b.quotes.length || a.engineer.display_name.localeCompare(b.engineer.display_name));
  return el("div", {},
    el("section", { class: "panel assign-panel" }, el("h3", {}, `Needs an engineer (${waiting.length})`),
      waiting.length ? quoteTable(waiting, { title: "Assign", cell: choices }) : el("p", { class: "empty-note" }, "Every open quote has an engineer.")),
    el("h3", { class: "section-title" }, "Current engineer workload"),
    el("p", { class: "view-note" }, "Fewest open quotes first"),
    el("div", { class: "work-grid wide" }, load.map(({ engineer, quotes }) => {
      const quoting = quotes.filter((q) => stageById(q.stage_id).key === "quoting").length;
      return el("section", { class: "panel" }, el("h3", {}, engineer.display_name),
        el("p", { class: "hint" }, `${quotes.length} open, ${quoting} in Quoting`),
        quotes.length ? quoteTable(quotes) : el("p", { class: "empty-note" }, "No open quotes"));
    })));
}

/* Table view: each column says how to show a quote and how to sort it. Blanks sort last. */
const TABLE_COLUMNS = [
  ["number", "Quote", (q) => q.quote_number],
  ["title", "Title", (q) => q.title],
  ["customer", "Customer", (q) => q.customer],
  ["stage", "Stage", (q) => stageById(q.stage_id).name, (q) => stageById(q.stage_id).position],
  ["priority", "Priority", (q) => (q.sales_priority ? `P${q.sales_priority}` : ""), (q) => q.sales_priority],
  ["key", "Key deal", (q) => (q.key_deal ? "Key deal" : ""), (q) => (q.key_deal ? 0 : null)],
  ["sales", "Sales owner", (q) => q.sales_owner_name || ""],
  ["engineering", "Engineering owner", (q) => q.engineering_owner_name || ""],
  ["due", "Quote due", (q) => (q.due_date ? shortDate(q.due_date) : ""), (q) => q.due_date],
  ["estimate", "Est. completion", (q) => (q.estimated_completion_date ? shortDate(q.estimated_completion_date) : ""), (q) => q.estimated_completion_date],
  ["gap", "Est. vs due", (q) => { const g = dayGap(q); return g === null ? "" : g > 0 ? `${g}d late` : g < 0 ? `${-g}d early` : "On date"; }, dayGap],
  ["contact", "Customer contact", (q) => q.contact_name || ""],
  ["documents", "Documents", (q) => (q.document_count ? String(q.document_count) : ""), (q) => q.document_count || null],
];

function buildTable() {
  const { key, direction } = state.sort;
  const column = TABLE_COLUMNS.find((c) => c[0] === key);
  const sortValue = column[3] || column[2];
  const blank = (v) => v === null || v === undefined || v === "";
  const rows = state.quotes.filter((q) => matchesFilters(q)).sort((a, b) => {
    const x = sortValue(a), y = sortValue(b);
    if (blank(x) || blank(y)) return blank(x) - blank(y);
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * direction;
  });
  if (!rows.length) return el("div", { class: "panel" }, el("p", { class: "empty-note" }, "No quotes match these filters."));
  const header = TABLE_COLUMNS.map(([id, label]) => el("th", { scope: "col", "aria-sort": id === key ? (direction > 0 ? "ascending" : "descending") : null },
    el("button", { class: "sort", onclick: () => { state.sort = { key: id, direction: id === key ? -direction : 1 }; drawContent(); } },
      `${label}${id === key ? (direction > 0 ? " ▲" : " ▼") : ""}`)));

const LANES = { sales: "Sales", engineering: "Engineering", shared: "Sales + Engineering" };

function buildColumns() {
  const stages = state.stages.filter((s) => s.active);
  /* Side-by-side stages with the same owner share one header. */
  const headers = [];
  stages.forEach((stage) => {
    const last = headers.at(-1);
    if (last && last.lane === stage.lane) last.count += 1;
    else headers.push({ lane: stage.lane, count: 1 });
  });
  const board = el("div", { class: "board" }, headers.map(({ lane, count }) => {
    const label = el("div", { class: `lane-label ${lane}` }, LANES[lane]);
    label.style.gridColumn = `span ${count}`;
    return label;
  }), stages.map(column));
  stages.forEach((s, index) => { board.querySelectorAll(".column")[index].style.gridColumn = String(index + 1); });

}

function wireDragging() {
  if (!canEdit() || !window.Sortable) return;
  document.querySelectorAll(".tiles").forEach((list) => {
    Sortable.create(list, {
      group: "quotes", sort: false, animation: 120, forceFallback: true, fallbackTolerance: 5,
      delay: 120, delayOnTouchOnly: true,
      onStart: () => { state.dragging = true; document.body.classList.add("dragging"); },
      onEnd: (event) => {
        state.dragging = false;
        document.body.classList.remove("dragging");
        if (event.from === event.to) return;
        requestMove(Number(event.item.dataset.id), Number(event.to.dataset.stage));
      },
    });
  });
}

/* Asks for whatever the destination stage needs, then saves. Cancelling puts the tile back. */
async function requestMove(quoteId, stageId) {
  const quote = state.quotes.find((q) => q.id === quoteId);
  const target = stageById(stageId);
  const source = stageById(quote.stage_id);
  const closedKinds = ["won", "lost"];
  const reopening = closedKinds.includes(source.kind) && !closedKinds.includes(target.kind);
  const fields = {};
  const body = [];
  if (target.requires_owner && !quote.engineering_owner_id) {
    fields.engineering_owner_id = el("select", { required: true }, userOptions(state.me.id, "Choose an engineering owner"));
    body.push(el("label", {}, "Engineering owner", fields.engineering_owner_id));
  }
  if (target.kind === "hold") {
    fields.missing_info = el("textarea", { required: true, placeholder: "Current print revision and annual volume" });
    fields.follow_up_owner_id = el("select", { required: true }, userOptions("", "Choose a person"));
    body.push(el("label", {}, "What's missing?", fields.missing_info), el("label", {}, "Who will follow up?", fields.follow_up_owner_id));
  }
  if (target.kind === "lost") {
    fields.loss_reason = el("select", { required: true }, options(state.lossReasons.map((r) => [r, r]), "", "Choose a reason"));
    body.push(el("label", {}, "Why was it lost?", fields.loss_reason));
  }
  if (target.kind === "won") body.push(el("p", {}, `This queues ${quote.quote_number} for the launch tracker handoff.`));
  if (reopening || target.kind === "won" || target.kind === "lost") {
    fields.note = el("textarea", { required: reopening, placeholder: reopening ? "Why is this being reopened?" : "" });
    body.push(el("label", {}, reopening ? "Reason for reopening" : "Note (optional)", fields.note));
  }

  const payload = { to_stage_id: stageId, version: quote.version };
  const save = async () => {
    await api("POST", `/api/quotes/${quoteId}/move`, payload);
    await refresh();
    toast(`${quote.quote_number} moved to ${target.name}`);
  };
  if (!body.length) {
    try { await save(); } catch (error) { await refresh().catch(() => {}); handleError(error); }
    return;
  }
  formDialog({
    title: `Move to ${target.name}`, subtitle: `${quote.quote_number}: ${quote.title}`, body, submitLabel: `Move to ${target.name}`, small: true,
    onSubmit: async () => {
      for (const [key, input] of Object.entries(fields)) payload[key] = input.value;
      await save();
    },
    onCancel: render,
  });
}

/* ---------- sales dashboard ---------- */
const money = (v) => (v >= 1e6 ? `$${(v / 1e6).toFixed(2)}M` : `$${Math.round(v / 1000)}K`);
const moneyAxis = (v) => (v >= 1e6 ? `$${(v / 1e6).toFixed(1)}M` : v ? `$${Math.round(v / 1000)}K` : "$0");
const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)", "var(--series-6)"];

function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  node.append(...children);
  return node;
}

function niceScale(value) {
  const rough = value / 4;
  const magnitude = 10 ** Math.floor(Math.log10(rough));
  const step = [1, 2, 2.5, 5, 10].find((m) => m * magnitude >= rough) * magnitude;
  return { step, top: Math.ceil(value / step) * step };
}

function chartFrame(categories, maxValue, height = 230, opts = {}) {
  const axis = opts.axis || moneyAxis;
  const label = opts.label || ((c) => c);
  const box = { left: 46, right: 470, top: 10, bottom: height - 24 };
  const { step, top } = niceScale(maxValue);
  const y = (v) => box.bottom - (v / top) * (box.bottom - box.top);
  const band = (box.right - box.left) / categories.length;
  const root = svg("svg", { viewBox: `0 0 480 ${height}`, class: "chart" });
  for (let value = 0; value <= top; value += step) {
    root.append(svg("line", { x1: box.left, x2: box.right, y1: y(value), y2: y(value), class: "grid" }),
      svg("text", { x: box.left - 6, y: y(value) + 4, "text-anchor": "end" }, axis(value)));
  }
  categories.forEach((c, i) => { const text = label(c, i); if (text) root.append(svg("text", { x: box.left + band * (i + 0.5), y: height - 6, "text-anchor": "middle" }, text)); });
  return { root, box, y, band };
}

function roundedTop(x, top, width, bottom, radius) {
  const r = Math.min(radius, bottom - top, width / 2);
  return `M${x} ${bottom}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + width - r}Q${x + width} ${top} ${x + width} ${top + r}V${bottom}Z`;
}

function hitArea(frame, index, tip) {
  return svg("rect", { x: frame.box.left + frame.band * index, y: frame.box.top, width: frame.band, height: frame.box.bottom - frame.box.top, class: "hit", "data-tip": tip });
}

function stackedColumns({ categories, series, tips }, opts = {}) {
  const format = opts.format || money;
  const colors = opts.colors || SERIES;
  const totals = categories.map((_, i) => series.reduce((sum, s) => sum + s.values[i], 0));
  const frame = chartFrame(categories, Math.max(1, ...totals), 230, opts);
  const width = Math.min(24, frame.band * 0.5);
  categories.forEach((category, i) => {
    let running = 0;
    const x = frame.box.left + frame.band * (i + 0.5) - width / 2;
    const present = series.map((s, n) => n).filter((n) => series[n].values[i] > 0);
    present.forEach((n) => {
      const value = series[n].values[i];
      const bottom = frame.y(running) - (running ? 1 : 0);
      running += value;
      const top = frame.y(running) + (n === present.at(-1) ? 0 : 1);
      frame.root.append(svg("path", { d: n === present.at(-1) ? roundedTop(x, top, width, bottom, 4) : `M${x} ${bottom}V${top}H${x + width}V${bottom}Z`, fill: colors[n] }));
    });
    frame.root.append(hitArea(frame, i, `${tips ? tips[i] : category}: ${series.filter((s) => s.values[i]).map((s) => `${s.name} ${format(s.values[i])}`).join(", ") || "none"}`));
  });
  return frame.root;
}

function groupedColumns({ categories, series }) {
  const frame = chartFrame(categories, Math.max(...series.flatMap((s) => s.values)));
  const width = Math.min(24, frame.band * 0.3);
  categories.forEach((category, i) => {
    const center = frame.box.left + frame.band * (i + 0.5);
    series.forEach((s, n) => {
      const x = center + (n - series.length / 2) * (width + 2) + 1;
      frame.root.append(svg("path", { d: roundedTop(x, frame.y(s.values[i]), width, frame.box.bottom, 4), fill: SERIES[n] }));
    });
    frame.root.append(hitArea(frame, i, `${category}: ${series.map((s) => `${s.name} ${money(s.values[i])}`).join(", ")}`));
  });
  return frame.root;
}

function lineChart({ categories, values, tips }, opts = {}) {
  const format = opts.format || money;
  const frame = chartFrame(categories, Math.max(1, ...values), 230, opts);
  const x = (i) => frame.box.left + frame.band * (i + 0.5);
  const points = values.map((v, i) => `${x(i)},${frame.y(v)}`).join(" ");
  frame.root.append(svg("polyline", { points, class: "line" }));
  const last = values.length - 1;
  frame.root.append(svg("circle", { cx: x(last), cy: frame.y(values[last]), r: 5, class: "dot" }),
    svg("text", { x: x(last) - 8, y: frame.y(values[last]) - 11, "text-anchor": "end", class: "end-label" }, format(values[last])));
  values.forEach((v, i) => frame.root.append(hitArea(frame, i, `${tips ? tips[i] : categories[i]}: ${format(v)}`)));
  return frame.root;
}

/* ---------- quote history ---------- */
/* Everything here is worked out in the browser from the rows /api/history returns,
   so changing a filter never needs another request. */
state.historyFilter = { months: 48, pillar: "", customer: "", allCustomers: false, allQuotes: false };
const count = (v) => Math.round(v).toLocaleString();
const pct = (won, lost) => (won + lost ? `${Math.round((won / (won + lost)) * 100)}%` : "No decisions");
const monthIndex = (iso) => Number(iso.slice(0, 4)) * 12 + Number(iso.slice(5, 7)) - 1;
const monthName = (index) => new Date(Math.floor(index / 12), index % 12, 1).toLocaleDateString(undefined, { month: "short", year: "numeric" });
const MAX_PILLAR_COLORS = 5;

function summarize(quotes) {
  const won = quotes.filter((q) => q.outcome === "won");
  const lost = quotes.filter((q) => q.outcome === "lost").length;
  return {
    quotes: quotes.length, customers: new Set(quotes.map((q) => q.customer)).size,
    value: quotes.reduce((sum, q) => sum + q.value, 0), wonValue: won.reduce((sum, q) => sum + q.value, 0),
    won: won.length, lost, open: quotes.filter((q) => q.outcome === "open").length,
  };
}

function renderHistory() {
  const page = el("main", { class: "page" }, el("p", { class: "empty-note" }, "Loading quote history"));
  api("GET", "/api/history").then((data) => { state.historyData = data; drawHistory(page); }).catch(handleError);
  return page;
}

function historyUpload() {
  if (!isAdmin()) return null;
  const message = el("div", { class: "error", role: "alert" });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", class: "file-input", "aria-label": "Replace the history file", onchange: async () => {
    const file = picker.files[0];

      toast(`History updated from ${file.name}`);
      drawHistory(document.querySelector("main.page"));

function drawHistory(page) {
  const data = state.historyData;
  const f = state.historyFilter;
  const all = data.quotes || [];
  if (!all.length) {
    page.replaceChildren(el("div", { class: "page-head" }, el("h2", {}, "Quote history")), sourcePanel(data));
    return;
  }
  const lastMonth = Math.max(...all.map((q) => monthIndex(q.date)));
  const firstMonth = Math.min(...all.map((q) => monthIndex(q.date)));
  const startMonth = Math.max(firstMonth, lastMonth - f.months + 1);

  /* Pillar colors follow the pillar, ranked across the whole file, so filtering never repaints them. */
  const pillarTotals = {};
  all.forEach((q) => { pillarTotals[q.pillar] = (pillarTotals[q.pillar] || 0) + 1; });
  const pillars = Object.keys(pillarTotals).sort((a, b) => pillarTotals[b] - pillarTotals[a]);
  const shown = pillars.length > MAX_PILLAR_COLORS + 1 ? pillars.slice(0, MAX_PILLAR_COLORS) : pillars;
  const group = (pillar) => (shown.includes(pillar) ? pillar : "Other");
  const groups = [...shown, ...(shown.length < pillars.length ? ["Other"] : [])];
  const colors = groups.map((g, i) => (g === "Other" ? "var(--ink-soft)" : SERIES[i]));

  const inRange = all.filter((q) => monthIndex(q.date) >= startMonth && (!f.pillar || q.pillar === f.pillar));
  const quotes = inRange.filter((q) => !f.customer || q.customer === f.customer);
  const totals = summarize(quotes);

  const update = (key) => (event) => { f[key] = key === "months" ? Number(event.target.value) : event.target.value; drawHistory(page); };
  const customers = [...new Set(all.map((q) => q.customer))].sort();
  const filters = el("div", { class: "filters history-filters" },
    el("label", {}, "Time range", el("select", { onchange: update("months") }, options([[12, "Last 12 months"], [24, "Last 24 months"], [36, "Last 36 months"], [48, "Last 48 months"], [999, "Everything"]], f.months))),
    el("label", {}, "Pillar", el("select", { onchange: update("pillar") }, options(pillars.map((p) => [p, p]), f.pillar, "All pillars"))),
    el("label", {}, "Customer", el("select", { onchange: update("customer") }, options(customers.map((c) => [c, c]), f.customer, "All customers"))),
    (f.pillar || f.customer) && el("button", { class: "btn", onclick: () => { f.pillar = ""; f.customer = ""; drawHistory(page); } }, "Clear filters"));

  /* Quarters, including empty ones so gaps show as gaps. */
  const quarterOf = (m) => Math.floor(m / 3);
  const quarters = [];
  for (let qn = quarterOf(startMonth); qn <= quarterOf(lastMonth); qn += 1) quarters.push(qn);
  const quarterName = (qn) => `Q${(qn % 4) + 1} ${Math.floor(qn / 4)}`;
  const quarterTip = (qn) => {
    const first = Math.max(qn * 3, startMonth), last = Math.min(qn * 3 + 2, lastMonth);
    return first === qn * 3 && last === qn * 3 + 2 ? quarterName(qn) : `${quarterName(qn)} (${monthName(first)} to ${monthName(last)} only)`;
  };
  const labels = quarters.length > 8 ? (c, i) => (quarters[i] % 4 === 0 ? String(Math.floor(quarters[i] / 4)) : "") : (c) => c;
  const byQuarter = (filter) => quarters.map((qn) => quotes.filter((q) => quarterOf(monthIndex(q.date)) === qn && filter(q)));
  const perQuarter = byQuarter(() => true);
  const quarterCounts = {
    categories: quarters.map(quarterName), tips: quarters.map(quarterTip),
    series: groups.map((g) => ({ name: g, values: quarters.map((qn, i) => perQuarter[i].filter((q) => group(q.pillar) === g).length) })),
  };
  const quarterValues = { categories: quarters.map(quarterName), tips: quarters.map(quarterTip), values: perQuarter.map((list) => list.reduce((sum, q) => sum + q.value, 0)) };

  const pillarRows = pillars.map((p) => ({ pillar: p, ...summarize(quotes.filter((q) => q.pillar === p)) })).filter((r) => r.quotes);
  const winRows = pillarRows.filter((r) => r.won + r.lost).map((r) => ({ label: r.pillar, value: Math.round((r.won / (r.won + r.lost)) * 100), won: r.won, decided: r.won + r.lost }));

  /* Customer trend compares the latest 12 months with the 12 before, whatever the time range. */
  const customerRows = [...new Set(quotes.map((q) => q.customer))].map((name) => {
    const own = quotes.filter((q) => q.customer === name);
    const recent = all.filter((q) => q.customer === name && (!f.pillar || q.pillar === f.pillar));
    const last12 = recent.filter((q) => monthIndex(q.date) > lastMonth - 12).length;
    const prior12 = recent.filter((q) => monthIndex(q.date) > lastMonth - 24 && monthIndex(q.date) <= lastMonth - 12).length;
    return { name, ...summarize(own), pillars: [...new Set(own.map((q) => q.pillar))].join(", "), last12, prior12, lastDate: own.at(-1).date };
  }).sort((a, b) => b.quotes - a.quotes || a.name.localeCompare(b.name));
  const change = (r) => (r.prior12 ? `${r.last12 - r.prior12 >= 0 ? "+" : ""}${Math.round(((r.last12 - r.prior12) / r.prior12) * 100)}%` : r.last12 ? "New" : "");
  const pickCustomer = (name) => () => { f.customer = name; f.allQuotes = false; drawHistory(page); window.scrollTo({ top: 0 }); };

  const visibleCustomers = f.allCustomers ? customerRows : customerRows.slice(0, 15);
  const recentQuotes = [...quotes].reverse();
  const visibleQuotes = f.allQuotes ? recentQuotes : recentQuotes.slice(0, 20);
  const outcomeName = { won: "Won", lost: "Lost", no_bid: "No bid", open: "Open" };
  const more = (list, total, key, noun) => total > list.length || f[key]
    ? el("button", { class: "btn", onclick: () => { f[key] = !f[key]; drawHistory(page); } }, f[key] ? "Show fewer" : `Show all ${count(total)} ${noun}`) : null;
  const stat = (value, label) => el("div", { class: "stat" }, el("b", {}, value), el("span", {}, label));
  const scope = [f.customer, f.pillar].filter(Boolean).join(", ");

  page.replaceChildren(
    el("div", { class: "page-head" }, el("h2", {}, "Quote history"),
      el("span", { class: "hint-text" }, `${monthName(startMonth)} to ${monthName(lastMonth)}${scope ? `, ${scope}` : ""}`)),
    data.sample && el("div", { class: "notice sample-note" }, "Sample data. Replace the history file with the EDA export to see real quotes."),
    filters,
    el("div", { class: "stats" }, stat(count(totals.quotes), "Quotes sent"), stat(count(totals.customers), "Customers quoted"),
      stat(money(totals.value), "Quoted value"), stat(pct(totals.won, totals.lost), `Win rate (${count(totals.won)} won, ${count(totals.lost)} lost)`),
      stat(money(totals.wonValue), "Won value"), stat(count(totals.open), "Still open")),
    el("div", { class: "grid2 sales-grid" },
      chartPanel("Quotes sent by quarter", "Count of quotes, by pillar. The first and last quarters may be partial.",
        legend(quarterCounts.series, colors), stackedColumns(quarterCounts, { format: count, axis: count, label: labels, colors }),
        dataTable(["Quarter", ...groups], quarters.map((qn, i) => [quarterName(qn), ...quarterCounts.series.map((s) => count(s.values[i]))]))),
      chartPanel("Quoted value by quarter", "Total value of quotes sent",
        lineChart(quarterValues, { label: labels }),
        dataTable(["Quarter", "Quoted value"], quarters.map((qn, i) => [quarterName(qn), money(quarterValues.values[i])]))),
      chartPanel("Win rate by pillar", "Won out of won plus lost. Open and no-bid quotes aren't counted.",
        winRows.length ? barList(winRows, "label", "value", (v) => `${v}%`, (r) => `, ${r.won} of ${r.decided} decided`) : el("p", { class: "empty-note" }, "No decided quotes in this range."),
        dataTable(["Pillar", "Win rate", "Won", "Decided"], winRows.map((r) => [r.label, `${r.value}%`, r.won, r.decided]))),
      chartPanel("Most-quoted customers", "Quotes sent in this range",
        barList(customerRows.slice(0, 10).map((r) => ({ label: r.name, value: r.quotes })), "label", "value", count))),
    el("section", { class: "panel" }, el("h3", {}, "By pillar"), el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Pillar"), ["Quotes", "Share", "Customers", "Quoted value", "Won value", "Win rate"].map((h) => el("th", { class: "num" }, h)))),
      el("tbody", {}, pillarRows.map((r) => el("tr", {}, el("td", {}, el("button", { class: "link", onclick: () => { f.pillar = r.pillar; drawHistory(page); } }, r.pillar)),
        el("td", { class: "num" }, count(r.quotes)), el("td", { class: "num" }, `${Math.round((r.quotes / totals.quotes) * 100)}%`), el("td", { class: "num" }, count(r.customers)),
        el("td", { class: "num" }, money(r.value)), el("td", { class: "num" }, money(r.wonValue)), el("td", { class: "num" }, pct(r.won, r.lost)))))))),
    el("section", { class: "panel" }, el("h3", {}, "By customer"),
      el("p", { class: "hint" }, "Change compares quotes sent in the latest 12 months with the 12 months before. Select a customer to see their quotes."),
      el("div", { class: "scroll" }, el("table", { class: "history-table" },
        el("thead", {}, el("tr", {}, el("th", {}, "Customer"), el("th", {}, "Pillars"), ["Quotes", "Last 12 mo", "Change", "Quoted value", "Win rate"].map((h) => el("th", { class: "num" }, h)), el("th", {}, "Last quote"))),
        el("tbody", {}, visibleCustomers.map((r) => el("tr", {}, el("td", {}, el("button", { class: "link", onclick: pickCustomer(r.name) }, r.name)), el("td", {}, r.pillars),
          el("td", { class: "num" }, count(r.quotes)), el("td", { class: "num" }, count(r.last12)), el("td", { class: "num" }, change(r)),
          el("td", { class: "num" }, money(r.value)), el("td", { class: "num" }, pct(r.won, r.lost)), el("td", {}, fullDate(r.lastDate))))))),
      more(visibleCustomers, customerRows.length, "allCustomers", "customers")),
    el("section", { class: "panel" }, el("h3", {}, f.customer ? `Quotes for ${f.customer}` : "Recent quotes"),
      el("div", { class: "scroll" }, el("table", { class: "history-table" },
        el("thead", {}, el("tr", {}, ["Date", "Quote", "Customer", "Pillar", "Parts"].map((h) => el("th", {}, h)), el("th", { class: "num" }, "Quoted value"), el("th", {}, "Outcome"))),
        el("tbody", {}, visibleQuotes.map((q) => el("tr", {}, el("td", {}, fullDate(q.date)), el("td", {}, q.id), el("td", {}, q.customer), el("td", {}, q.pillar),
          el("td", {}, q.parts.join(", ")), el("td", { class: "num" }, money(q.value)), el("td", {}, outcomeName[q.outcome])))))),
      more(visibleQuotes, recentQuotes.length, "allQuotes", "quotes")),
    sourcePanel(data));
}

                    role: el("select", {}, options(roles, "quoter")), password: el("input", { type: "password", required: true, minlength: 12, autocomplete: "new-password" }) };
  const userForm = el("form", { class: "form-row", onsubmit: (event) => { event.preventDefault();
      run(() => api("POST", "/api/users", Object.fromEntries(Object.entries(newUser).map(([k, v]) => [k, v.value]))))(); } },
    el("label", {}, "Name", newUser.display_name), el("label", {}, "Username", newUser.username), el("label", {}, "Role", newUser.role),
    el("label", {}, "Temporary password", newUser.password), el("button", { class: "btn" }, "Add user"));

  const handoff = el("section", { class: "panel" }, el("h3", {}, "Waiting for the launch tracker"), el("p", { class: "empty-note" }, "Loading"));
  api("GET", "/api/handoffs").then((items) => {
    const pending = items.filter((i) => i.status === "pending");
    handoff.replaceChildren(el("h3", {}, "Waiting for the launch tracker"),
      el("p", { class: "hint" }, "Won quotes queue here until the two apps are connected."),
      pending.length ? el("ul", { class: "history" }, pending.map((i) => el("li", {}, `${i.payload.quote_number}: ${i.payload.title}`, el("small", {}, `${i.event_type === "quote.won" ? "Won" : "Reopened"}, ${dateTime(i.created_at)}`))))
        : el("p", { class: "empty-note" }, "Nothing is waiting."));
  }).catch(handleError);

  return el("main", { class: "page" }, el("div", { class: "page-head" }, el("h2", {}, "Settings")),
    el("div", { class: "grid2" },
      el("section", { class: "panel" }, el("h3", {}, "Stages"), stageRows, stageForm),
      el("section", { class: "panel" }, el("h3", {}, "People"), userRows, userForm)),
    handoff);
}

function resetPassword(user) {
  const password = el("input", { type: "password", required: true, minlength: 12, autocomplete: "new-password" });
  formDialog({
    title: `Reset password for ${user.display_name}`, small: true, submitLabel: "Reset password",
    body: [el("label", {}, "Temporary password (12 or more characters)", password)],
    onSubmit: async () => { await api("PATCH", `/api/users/${user.id}`, { password: password.value }); toast("Password reset"); },
  });
}

/* ---------- start ---------- */
setInterval(() => {
  const busy = state.dragging || document.querySelector("dialog[open]") || document.activeElement?.matches("input, select, textarea");
  if (state.me && state.view === "board" && !busy && !document.hidden) refresh().catch(handleError);
}, 30000);

refresh().catch((error) => (error.status === 401 ? renderLogin() : handleError(error)));

</script>
</body>
</html>
